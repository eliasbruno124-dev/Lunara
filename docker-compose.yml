name: lunara

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: lunara-api:1.0.3
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_NAME: ${APP_NAME:-Lunara}
      APP_VERSION: ${APP_VERSION:-1.0.3}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lunara}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lunara}?schema=public
      APP_MASTER_KEY: ${APP_MASTER_KEY:?Set APP_MASTER_KEY}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:?Set AUTH_SIGNING_KEY}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?Set REFRESH_TOKEN_PEPPER}
      # Required only until the first successful setup; may be removed later.
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      NTPY_ENABLED: ${NTPY_ENABLED:-false}
      NTPY_BASE_URL: ${NTPY_BASE_URL:-}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-true}
      OPENAPI_TRUST_AUTHENTIK: ${OPENAPI_TRUST_AUTHENTIK:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      INVITATION_TTL_MINUTES: ${INVITATION_TTL_MINUTES:-30}
      TZ: ${TZ:-Europe/Berlin}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      app_internal:
      proxy:
        aliases:
          - lunara-api
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 128M
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      traefik.enable: "false"

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: lunara-api:1.0.3
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-lunara}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lunara}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "prisma:migrate:deploy", "--prefix", "services/api"]
    networks:
      - app_internal
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    labels:
      traefik.enable: "false"
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lunara}
      POSTGRES_USER: ${POSTGRES_USER:-lunara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Berlin}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    shm_size: 128m
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 256M
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: lunara_postgres_data

networks:
  app_internal:
    name: lunara_internal
    internal: true
  proxy:
    name: ${PROXY_NETWORK:-pangolin}
    external: true
