# ─────────────────────────────────────────────────────────────────────────────
#  Lunara – the whole installation in one file
#
#  1. Point a domain (e.g. lunara.example.com) to this server.
#  2. Put this file into an empty folder, then run in that folder:
#
#        echo "LUNARA_DOMAIN=lunara.example.com" > .env
#        docker compose up -d
#
#     (Portainer, standalone Docker: paste this file as a stack and add the
#      environment variable LUNARA_DOMAIN. Docker Swarm is not supported.)
#  3. Open https://lunara.example.com, choose "My own server" →
#     "Set up Lunara" and enter the setup code shown by:
#
#        docker compose logs lunara
#
#  That's it. Passwords and keys are created automatically on the first start
#  and kept in the "lunara_secrets" volume. HTTPS certificates come from
#  Let's Encrypt automatically (ports 80 and 443 must be reachable).
#
#  Already running a reverse proxy (Traefik, Nginx Proxy Manager …)?
#  Use docker-compose.proxy.yml instead.
#
#  Back up BOTH volumes "database" and "secrets" – the keys in "secrets" are
#  needed to read the data in "database".
#  More help: https://github.com/eliasbruno124-dev/Lunara/blob/main/docs/INSTALL.md
# ─────────────────────────────────────────────────────────────────────────────

name: lunara

x-lunara-image: &lunara-image ghcr.io/eliasbruno124-dev/lunara:${LUNARA_VERSION:-latest}

# Security defaults for the Lunara containers.
x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp:size=32m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # Creates the passwords and keys once (nothing to do for you).
  init:
    image: *lunara-image
    <<: *hardening
    command: ["init-secrets"]
    restart: "no"
    volumes:
      - secrets:/secrets
    network_mode: none

  # The database. Only reachable inside this installation.
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: lunara
      POSTGRES_USER: lunara
      POSTGRES_PASSWORD_FILE: /secrets/postgres_password
    volumes:
      - database:/var/lib/postgresql
      - secrets:/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunara -d lunara"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      init:
        condition: service_completed_successfully
    networks: [internal]

  # Updates the database structure on every start, then stops.
  migrate:
    image: *lunara-image
    <<: *hardening
    command: ["./node_modules/.bin/prisma", "migrate", "deploy", "--config", "services/api/prisma/prisma.config.ts"]
    restart: "no"
    volumes:
      - secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # Lunara itself: server, web app and Android app download.
  lunara:
    image: *lunara-image
    <<: *hardening
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_BASE_URL: https://${LUNARA_DOMAIN:?Set LUNARA_DOMAIN to your domain, e.g. lunara.example.com}
      TZ: ${TZ:-Europe/Berlin}
      # Optional: sign in with Authentik (see docs/AUTHENTIK.md).
      AUTHENTIK_URL: ${AUTHENTIK_URL:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_SLUG: ${AUTHENTIK_SLUG:-}
    volumes:
      - secrets:/secrets:ro
    ports:
      - "127.0.0.1:${LUNARA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal, web]

  # Automatic HTTPS for your domain.
  caddy:
    image: caddy:2
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${LUNARA_DOMAIN}", "--to", "lunara:3000"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certificates:/data
    depends_on: [lunara]
    networks: [web]

# Fixed names, so backups work the same no matter what the stack is called.
volumes:
  database:
    name: lunara_database
  secrets:
    name: lunara_secrets
  certificates:
    name: lunara_certificates

networks:
  internal:
    internal: true
  web:
    name: lunara_web
