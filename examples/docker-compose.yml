# Lunara – example Compose file for your own server
#
# Quick start:
#   1. Copy this file and .env.example into an empty folder
#   2. cp .env.example .env  and fill in the values (see comments)
#   3. docker compose up -d
#   4. With HTTPS: docker compose --profile caddy up -d   (see Caddyfile)
#
# Full guide: docs/INSTALL.md

name: lunara

services:
  # The database. Only reachable on the internal network, never exposed.
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: lunara
      POSTGRES_USER: lunara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/Berlin}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunara -d lunara"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal

  # One-off run on every start: brings the database schema up to the
  # image's version (Prisma migrations) and then exits.
  migrate:
    image: ghcr.io/eliasbruno124-dev/lunara:${LUNARA_VERSION:-1.3.5}
    restart: "no"
    command: ["./node_modules/.bin/prisma", "migrate", "deploy", "--config", "services/api/prisma/prisma.config.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lunara:${POSTGRES_PASSWORD}@postgres:5432/lunara?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Lunara itself: API + installable web app + APK download under one address.
  lunara:
    image: ghcr.io/eliasbruno124-dev/lunara:${LUNARA_VERSION:-1.3.5}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_VERSION: ${LUNARA_VERSION:-1.3.5}
      # Public HTTPS address at which phones and browsers reach Lunara.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      DATABASE_URL: postgresql://lunara:${POSTGRES_PASSWORD}@postgres:5432/lunara?schema=public
      APP_MASTER_KEY: ${APP_MASTER_KEY:?set APP_MASTER_KEY in .env}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:?set AUTH_SIGNING_KEY in .env}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?set REFRESH_TOKEN_PEPPER in .env}
      # Only needed for the very first setup; remove it from .env afterwards.
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      # true = anyone who can reach the address may create their own account.
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      TZ: ${TZ:-Europe/Berlin}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Published on localhost only. From outside, use a reverse proxy with
      # HTTPS (Caddy below, Traefik, nginx …), never plain HTTP.
      - "127.0.0.1:${LUNARA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
      - web
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Optional: automatic HTTPS with Let's Encrypt.
  # Start with: docker compose --profile caddy up -d
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    environment:
      LUNARA_DOMAIN: ${LUNARA_DOMAIN:-lunara.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - lunara
    networks:
      - web

volumes:
  postgres_data:
  caddy_data:

networks:
  internal:
    internal: true
  web:
