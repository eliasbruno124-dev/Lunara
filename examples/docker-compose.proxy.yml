# ─────────────────────────────────────────────────────────────────────────────
#  Lunara – one-file installation for servers that ALREADY have a reverse
#  proxy (Traefik, Nginx Proxy Manager, Caddy, Pangolin …).
#
#  1. Save this file as "docker-compose.yml" in an empty folder, then:
#        echo "LUNARA_DOMAIN=lunara.example.com" > .env
#        docker compose up -d
#     (Portainer, standalone Docker: paste as a stack, add LUNARA_DOMAIN.)
#  2. Let your proxy forward https://lunara.example.com to Lunara:
#     - proxy runs directly on this host:  http://127.0.0.1:3000
#     - proxy runs in Docker: add the proxy container to the network
#       "lunara_web" and use  http://lunara:3000
#     (change the port with LUNARA_PORT). Only HTTPS, one proxy hop.
#  3. Open the address, choose "My own server" and create your account with
#     the setup code from:  docker compose logs lunara
#
#  Back up BOTH volumes "database" and "secrets".
#  No proxy yet? Use docker-compose.yml – it includes automatic HTTPS.
# ─────────────────────────────────────────────────────────────────────────────

name: lunara

x-lunara-image: &lunara-image ghcr.io/eliasbruno124-dev/lunara:${LUNARA_VERSION:-latest}

# Security defaults for the Lunara containers.
x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp:size=32m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # Creates the passwords and keys once (nothing to do for you).
  init:
    image: *lunara-image
    <<: *hardening
    command: ["init-secrets"]
    restart: "no"
    volumes:
      - secrets:/secrets
    network_mode: none

  # The database. Only reachable inside this installation.
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: lunara
      POSTGRES_USER: lunara
      POSTGRES_PASSWORD_FILE: /secrets/postgres_password
    volumes:
      - database:/var/lib/postgresql
      - secrets:/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunara -d lunara"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      init:
        condition: service_completed_successfully
    networks: [internal]

  # Updates the database structure on every start, then stops.
  migrate:
    image: *lunara-image
    <<: *hardening
    command: ["./node_modules/.bin/prisma", "migrate", "deploy", "--config", "services/api/prisma/prisma.config.ts"]
    restart: "no"
    volumes:
      - secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # Lunara itself: server, web app and Android app download.
  lunara:
    image: *lunara-image
    <<: *hardening
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_BASE_URL: https://${LUNARA_DOMAIN:?Set LUNARA_DOMAIN to your domain, e.g. lunara.example.com}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - secrets:/secrets:ro
    ports:
      - "127.0.0.1:${LUNARA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal, web]

# Fixed names, so backups work the same no matter what the stack is called.
volumes:
  database:
    name: lunara_database
  secrets:
    name: lunara_secrets

networks:
  internal:
    internal: true
  web:
    name: lunara_web
