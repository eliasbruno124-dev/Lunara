name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android.yml"
      - "apps/android/**"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/android.yml"
      - "apps/android/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "9.3.1"

jobs:
  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Run Android lint
        run: gradle -p apps/android --no-daemon lintLocalDebug lintProductionDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: |
            apps/android/app/build/reports/lint-results-*
          if-no-files-found: warn
          retention-days: 14

  unit-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Run Android unit tests
        run: >-
          gradle -p apps/android --no-daemon
          testLocalDebugUnitTest
          testProductionDebugUnitTest

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  debug-build:
    name: Android debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build local and production debug APKs
        run: >-
          gradle -p apps/android --no-daemon
          assembleLocalDebug
          assembleProductionDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: lunara-debug-apks
          path: |
            apps/android/app/build/outputs/apk/local/debug/*.apk
            apps/android/app/build/outputs/apk/production/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  unsigned-release:
    name: Unsigned production release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build unsigned production release APK and app bundle
        run: >-
          gradle -p apps/android --no-daemon --max-workers=1
          assembleProductionRelease bundleProductionRelease

      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lunara-release-unsigned
          path: |
            apps/android/app/build/outputs/apk/production/release/*.apk
            apps/android/app/build/outputs/bundle/productionRelease/*.aab
          if-no-files-found: error
          retention-days: 14
