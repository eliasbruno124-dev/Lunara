name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android.yml"
      - "apps/android/**"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/android.yml"
      - "apps/android/**"
  workflow_dispatch:
    inputs:
      ui_only:
        description: Run only the hosted device regression and screenshots
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "9.3.1"

jobs:
  lint:
    if: ${{ !inputs.ui_only }}
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Run Android lint
        run: gradle -p apps/android --no-daemon lintLocalDebug lintProductionDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: |
            apps/android/app/build/reports/lint-results-*
          if-no-files-found: warn
          retention-days: 14

  unit-tests:
    if: ${{ !inputs.ui_only }}
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Run Android unit tests
        run: >-
          gradle -p apps/android --no-daemon
          testLocalDebugUnitTest
          testProductionDebugUnitTest

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  debug-build:
    if: ${{ !inputs.ui_only }}
    name: Android debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build local and production debug APKs
        run: >-
          gradle -p apps/android --no-daemon
          assembleLocalDebug
          assembleProductionDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: lunara-debug-apks
          path: |
            apps/android/app/build/outputs/apk/local/debug/*.apk
            apps/android/app/build/outputs/apk/production/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  unsigned-release:
    if: ${{ !inputs.ui_only }}
    name: Unsigned production release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build unsigned production release APK and app bundle
        run: >-
          gradle -p apps/android --no-daemon --max-workers=1
          assembleProductionRelease bundleProductionRelease

      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lunara-release-unsigned
          path: |
            apps/android/app/build/outputs/apk/production/release/*.apk
            apps/android/app/build/outputs/bundle/productionRelease/*.aab
          if-no-files-found: error
          retention-days: 14

  device-validation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ui_only }}
    name: Hosted device regression and visual evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build app and instrumentation APKs
        working-directory: apps/android
        run: ./gradlew --no-daemon --max-workers=1 assembleProductionDebug assembleProductionDebugAndroidTest
      - name: Enable KVM on this disposable hosted runner only
        run: sudo chmod a+rw /dev/kvm
      - name: Run all instrumented tests on API 36
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash scripts/android-ui-ci.sh
      - name: Keep test log and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-device-validation
          path: artifacts/device-validation/
          if-no-files-found: error
          retention-days: 14
