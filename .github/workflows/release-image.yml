name: Release container image

# Publishes ghcr.io/<owner>/lunara for every version tag (v1.2.3).
# The image bundles the signed APK from artifacts/, so the tag must point at a
# commit whose APK already carries the same versionName.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.3.4"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Derive version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${tag} is not a release version" >&2
            exit 1
          fi
          grep -q "versionName = \"${version}\"" apps/android/app/build.gradle.kts || {
            echo "Android versionName does not match ${version}" >&2
            exit 1
          }
          (cd artifacts && grep ' lunara-release.apk$' SHA256SUMS | sha256sum --check --strict)
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lunara" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=Lunara
            org.opencontainers.image.description=Private self-hosted cycle tracking for two roles
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Smoke test both architectures
        run: |
          image="${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}"
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "${platform}" "${image}" \
              node -e "require('argon2'); require('@prisma/client'); require('fs').accessSync('/app/apps/web/dist/downloads/lunara.apk'); console.log(process.arch, 'ok')"
          done
