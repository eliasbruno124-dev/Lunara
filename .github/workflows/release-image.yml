name: Release container image

# Publishes ghcr.io/<owner>/lunara for every version tag (v1.2.3).
# The image bundles the signed APK from artifacts/, so the tag must point at a
# commit whose APK already carries the same version and the release signer.
# Images are first pushed under a candidate tag, tested on both
# architectures and only then promoted to <version> (and latest).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.3.4"
        required: true

permissions:
  contents: read
  packages: write

# One release at a time, so concurrent tags cannot race for `latest`.
concurrency:
  group: release-image
  cancel-in-progress: false

env:
  # SHA-256 of the "CN=Lunara Upload" release signing certificate.
  RELEASE_SIGNER_SHA256: 5a75f197b2da32642669f62b47e8a5ae681a02e4fa2fa907a2f380cd199a3617

jobs:
  image:
    name: Build, test and promote multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Derive version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${tag} is not a release version" >&2
            exit 1
          fi
          revision="$(git rev-parse HEAD)"
          newest="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "latest=$([[ "${newest}" == "${tag}" ]] && echo true || echo false)" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lunara" >> "${GITHUB_OUTPUT}"

      - name: Verify bundled APK
        run: |
          version="${{ steps.version.outputs.version }}"
          apk=artifacts/lunara-release.apk
          (cd artifacts && grep ' lunara-release.apk$' SHA256SUMS | sha256sum --check --strict)
          build_tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          badging="$("${build_tools}/aapt2" dump badging "${apk}" | head -n 1)"
          echo "${badging}"
          [[ "${badging}" == *"name='de.lunara.app'"* && "${badging}" == *"versionName='${version}'"* ]] || {
            echo "APK package/version does not match ${version}" >&2
            exit 1
          }
          signer="$("${build_tools}/apksigner" verify --print-certs "${apk}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          [[ "${signer}" == "${RELEASE_SIGNER_SHA256}" ]] || {
            echo "APK is not signed with the release certificate" >&2
            exit 1
          }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VCS_REF=${{ steps.version.outputs.revision }}
          tags: ${{ steps.version.outputs.image }}:candidate-${{ steps.version.outputs.revision }}
          labels: |
            org.opencontainers.image.title=Lunara
            org.opencontainers.image.description=Private self-hosted cycle tracking for two roles
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}

      - name: Test candidate on both architectures
        run: |
          candidate="${{ steps.version.outputs.image }}:candidate-${{ steps.version.outputs.revision }}"
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "${platform}" "${candidate}" \
              node -e "require('argon2'); require('@prisma/client'); require('fs').accessSync('/app/apps/web/dist/downloads/lunara.apk'); console.log(process.arch, 'ok')"
          done

      - name: Promote candidate
        run: |
          image="${{ steps.version.outputs.image }}"
          candidate="${image}:candidate-${{ steps.version.outputs.revision }}"
          tags=(--tag "${image}:${{ steps.version.outputs.version }}")
          if [[ "${{ steps.version.outputs.latest }}" == "true" ]]; then
            tags+=(--tag "${image}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${candidate}"
          docker buildx imagetools inspect "${image}:${{ steps.version.outputs.version }}"
