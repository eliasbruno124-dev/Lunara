name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        # Public repositories and private organizations with GitHub Advanced
        # Security can enforce this check. It remains advisory for other private
        # repositories; npm audit still runs as a blocking, secret-free check.
        continue-on-error: ${{ github.event.repository.private }}
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
