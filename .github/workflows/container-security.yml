name: Container and dependency security

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/container-security.yml"
      - "infra/docker/api.Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "scripts/secret-scan.sh"
      - ".gitleaksignore"
      - "package.json"
      - "package-lock.json"
      - "apps/web/**"
      - "services/api/**"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/container-security.yml"
      - "infra/docker/api.Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "scripts/secret-scan.sh"
      - ".gitleaksignore"
      - "package.json"
      - "package-lock.json"
      - "apps/web/**"
      - "services/api/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: container-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Redacted secret and history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan source and Git history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify lockfile installation
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  image:
    name: Build, scan and generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          load: true
          push: false
          tags: lunara-api:ci
          build-args: |
            VCS_REF=${{ github.sha }}

      # Pinned to the reviewed v0.24.0 commit rather than a mutable v0 tag.
      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: lunara-api:ci
          format: cyclonedx-json
          output-file: lunara-api.cdx.json
          upload-artifact: "false"
          upload-release-assets: "false"

      # Trivy tags were compromised in March 2026. Keep this safe release pinned.
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: lunara-api:ci
          version: v0.72.0
          format: table
          exit-code: "1"
          # Keep blocking every fixable HIGH/CRITICAL finding. Debian findings
          # without an available package fix are tracked through pinned base-
          # image updates but cannot be remediated by this application build.
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Upload CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lunara-api-sbom-cyclonedx
          path: lunara-api.cdx.json
          if-no-files-found: error
          retention-days: 30
